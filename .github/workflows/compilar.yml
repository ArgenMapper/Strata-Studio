name: Generar instaladores
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Sistema que deseas compilar
        type: choice
        required: true
        default: all
        options: [all, windows, macos, linux]
permissions:
  contents: read
jobs:
  compilar:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-15-intel"]' || inputs.platform == 'linux' && '["ubuntu-24.04"]' || '["windows-latest","macos-15-intel","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: '3.15.0'
          architecture: x64
      - name: Python universal2 oficial (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.15.0/python-3.15.0-macos11.pkg
          echo "7c7e7eca61cbfa5f0c6f80cd594cddbfd492f4e8b3fb87e3d9fa1efebaec43ed  $RUNNER_TEMP/python.pkg" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /bin/bash '/Applications/Python 3.15/Install Certificates.command'
          echo '/Library/Frameworks/Python.framework/Versions/3.15/bin' >> "$GITHUB_PATH"
      - name: Bibliotecas de escritorio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libegl1 libgl1 libnss3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcomposite1 libxdamage1 libxrandr2 libasound2t64 libdbus-1-3 libsecret-1-0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Preparar cifrado universal (Mac)
        if: runner.os == 'macOS'
        run: python3 packaging/macos_crypto.py
      - name: Instalar dependencias
        run: python3 -m pip install -r requirements-build.txt
        if: runner.os != 'Windows'
      - name: Instalar dependencias Windows
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-build.txt
      - name: Compilar y comprobar arranque (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 compilar_multiplataforma.py
      - name: Compilar y comprobar arranque (Mac)
        if: runner.os == 'macOS'
        run: python3 compilar_multiplataforma.py
      - name: Compilar y comprobar instalador (Windows)
        if: runner.os == 'Windows'
        run: python compilar_multiplataforma.py
      - name: Pruebas del núcleo
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Pruebas del núcleo Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Guardar paquetes verificados
        uses: actions/upload-artifact@v4
        with:
          name: Strata-${{ runner.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Guardar informes de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-${{ runner.os }}
          path: |
            build/runtime-*.json
            build/runtime-checks/*.json
            build/macos-crypto.json
            build/macos-crypto-Cargo.lock
          if-no-files-found: ignore
